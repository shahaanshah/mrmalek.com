# Nixpacks configuration for Coolify / Railway / VPS deployment
[variables]
NIXPACKS_NODE_VERSION = "22"
NODE_ENV = "production"
NPM_CONFIG_PRODUCTION = "false"

[phases.setup]
nixPkgs = ["nodejs_22", "npm-10_x"]

[phases.install]
cmds = ["rm -f package-lock.json && npm install --include=dev --include=optional"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "node .output/server/index.mjs"
