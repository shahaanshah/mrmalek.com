services:
  - type: web
    name: mrmalek-portfolio
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CMS_SESSION_SECRET
        generateValue: true
      - key: CMS_ADMIN_EMAIL
        value: admin@mrmalek.com
      - key: CMS_ADMIN_INITIAL_PASSWORD
        generateValue: true
      - key: CMS_DB_PATH
        value: ./.data/cms.sqlite
